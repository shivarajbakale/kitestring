name: Feature request
description: Suggest a change to Kitestring.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you or your agent are trying to do, and where Kitestring gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The command, tool, step option or behaviour you have in mind.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy
      description: Does this change what agents can do without asking, what Kitestring stores, or what the extension can read? Say how.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
