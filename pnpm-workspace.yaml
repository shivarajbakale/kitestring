packages:
  - "packages/*"
  - "apps/*"
  - "e2e"
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
# Patched versions of build-time packages pulled in by plasmo and vitest (pnpm audit); none of them ships to users.
overrides:
  sharp: ">=0.35.5"
  browserslist: ">=4.28.7"
  msgpackr: ">=1.10.1"
  content-security-policy-parser: ">=0.6.0"
  "@vue/server-renderer": ">=3.5.42"
  tinypool: ">=2.1.2"
  vite: ">=6.4.3"
