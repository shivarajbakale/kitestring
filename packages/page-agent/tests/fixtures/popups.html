<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Popups</title></head><body>
<main><h1>Popups</h1><form aria-label="Newsletter preferences"><label for="em">Email</label><input id="em" type="email"><button id="go" type="button">Continue</button></form></main>
<div id="onetrust-banner-sdk" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6)">
  <div style="background:#fff;margin:40px;padding:24px"><p>We use cookies.</p>
    <button>Accept all</button><button>Reject all</button><button>Settings</button></div></div>
<div id="only-accept" role="dialog" aria-label="Cookie banner" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6)">
  <div style="background:#fff;margin:40px;padding:24px"><p>We use cookies.</p><button>Accept</button></div></div>
<div id="newsletter" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6)">
  <div style="background:#fff;margin:40px;padding:24px"><p>Get 10% off - subscribe to our newsletter</p>
    <button aria-label="Close">&times;</button><button>Subscribe</button></div></div>
<div id="maintenance" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6)">
  <div style="background:#fff;margin:40px;padding:24px"><p>Maintenance tonight</p><button>OK</button></div></div>
<div id="risky" role="dialog" aria-label="Cookie banner" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6)">
  <div style="background:#fff;margin:40px;padding:24px"><p>We use cookies.</p><button>Delete account</button></div></div>
<div id="generic-cookie" class="cookie-banner" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6)">
  <div style="background:#fff;margin:40px;padding:24px"><p>This site uses cookies.</p><button>Accept</button><button>Reject</button></div></div>
<div id="terms-consent" class="consent-modal" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6)">
  <div style="background:#fff;margin:40px;padding:24px"><p>Please agree to the new terms of service.</p><button>Agree</button></div></div>
<div id="close-account" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6)">
  <div style="background:#fff;margin:40px;padding:24px"><p>Before you go: subscribe to our newsletter</p>
    <button>Close account</button><button>Dismiss review</button><button>Subscribe</button></div></div>
<div id="news-order" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6)">
  <div style="background:#fff;margin:40px;padding:24px"><p>Sign up for 10% off</p>
    <button>No thanks</button><button>Subscribe</button><button>Close</button></div></div>
<dialog id="news-dialog"><p>Subscribe to our newsletter</p><button>Subscribe</button><button>No, thanks</button></dialog>
</body></html>
