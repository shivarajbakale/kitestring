<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>never-idle</title></head><body>
<main><h1>Never idle</h1><div id="deco" aria-hidden="true">decor</div><button id="go">Go</button></main>
<script>
window.__result = undefined
let t = 0
setInterval(() => { deco.style.opacity = (t++ % 10) / 10 + 0.05 }, 100)
setInterval(() => { fetch("/analytics/google-analytics").catch(() => {}) }, 200)
go.addEventListener("click", () => { window.__result = "go" })
</script>
</body></html>
