<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>file-upload</title>
<style>
  #b { display: none }
  #drop { border: 2px dashed #888; padding: 24px; width: 220px; cursor: pointer }
</style></head><body>
<main><h1>File upload</h1>
<p><label for="a">Extension zip</label> <input type="file" id="a"></p>

<p><button id="pick">Choose screenshots</button><input type="file" id="b" multiple></p>

<div id="drop" role="button" tabindex="0">Drop icon here</div>
<section aria-label="Clearing">
<p><label for="d">Resume (cleared after reading)</label> <input type="file" id="d"></p>
<div id="drop2" role="button" tabindex="0">Drop avatar here</div>
</section>
<pre id="out"></pre></main>
<script>
// Three ways pages take files: a plain input, a hidden input behind a button, and a drop zone that
// builds a detached input on click (nothing in the DOM is associated with it).
window.__result = undefined
const got = { a: [], b: [], c: [] }
const names = (input) => Array.from(input.files, (f) => f.name)
function update(key, input) {
  got[key] = names(input)
  out.textContent = JSON.stringify(got)
  if (got.a.length && got.b.length && got.c.length) window.__result = JSON.stringify(got)
}
a.addEventListener("change", () => update("a", a))
b.addEventListener("change", () => update("b", b))
pick.addEventListener("click", () => b.click())
// Pages that read the files in their change handler and then reset the input (so the same file can be
// chosen again): input.files is empty by the time anyone looks.
window.__cleared = undefined
const cleared = { d: [], e: [] }
function readAndClear(key, input) {
  cleared[key] = names(input)
  input.value = ""
  window.__cleared = JSON.stringify(cleared)
}
d.addEventListener("change", () => readAndClear("d", d))
drop2.addEventListener("click", () => {
  const input = document.createElement("input")
  input.type = "file"
  input.addEventListener("change", () => readAndClear("e", input))
  input.click()
})
drop.addEventListener("click", () => {
  const input = document.createElement("input")
  input.type = "file"
  input.addEventListener("change", () => update("c", input))
  input.click()
})
</script>
</body></html>
