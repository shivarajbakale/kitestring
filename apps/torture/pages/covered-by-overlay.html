<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>covered-by-overlay</title></head><body>
<main><h1>Covered</h1><button id="go">Continue</button></main>
<div id="overlay" role="dialog" aria-label="Scheduled maintenance" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center">
<div style="background:#fff;padding:24px"><p>Maintenance tonight</p><button id="ok">OK</button></div></div>
<script>
window.__result = undefined
ok.addEventListener("click", () => overlay.remove())
go.addEventListener("click", () => { window.__result = document.getElementById("overlay") ? "WRONG:overlay present" : "continued" })
</script>
</body></html>
